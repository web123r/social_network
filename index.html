<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferronme - log in or sign up</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-content">
            <div class="login-left">
                <img src="https://static.xx.fbcdn.net/rsrc.php/y1/r/4lCrCGs383h.svg" alt="Facebook Logo">
                <h2>Connect with friends and the world around you on Facebook.</h2>
            </div>
            <div class="login-right">
                <div class="login-box">
                    <input type="text" placeholder="Email or phone number" aria-label="Email or phone number">
                    <input type="password" placeholder="Password" aria-label="Password">
                    <!-- Link redirects to our feed.html to simulate logging in -->
                    <button class="btn-login" onclick="window.location.href='feed.html'">Log In</button>
                    <a href="#" class="forgot-link">Forgot password?</a>
                    <hr>
                    <button class="btn-create">Create new account</button>
                </div>
                <div class="create-page-link">
                    <a href="#">Create a Page</a> for a celebrity, brand or business.
                </div>
            </div>
        </div>
    </div>
</body>
</html>
